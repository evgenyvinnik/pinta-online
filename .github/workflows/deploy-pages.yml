name: Deploy web app to GitHub Pages

# The Web visual regression workflow builds and uploads the production directory only after every
# release check passes. This workflow downloads that exact artifact by run id; it never checks out
# or rebuilds a newer commit, and it has no manual path that can bypass the release gate.
on:
  workflow_run:
    workflows: ['Web visual regression']
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare tested website artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Download tested production directory
        uses: actions/download-artifact@v7
        with:
          name: github-pages-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish tested website
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
