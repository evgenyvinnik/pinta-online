name: Deploy web app to GitHub Pages

# Deploying an untested commit puts a broken editor in front of every visitor, so this waits
# for the test workflow rather than racing it. Both run from the same push; only this one is
# gated on the result. A manual dispatch still deploys the current master on demand.
on:
  workflow_run:
    workflows: ['Web visual regression']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    # A failed or cancelled test run must not reach production. workflow_dispatch has no
    # workflow_run payload, which is what the second clause allows through.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build the exact commit the tests passed against, not whatever master has moved to.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Verify localized catalogs
        run: npm run verify:i18n
      - name: Verify localized SEO pages
        run: npm run verify:seo
      - name: Verify icon references
        run: npm run verify:icons
      - name: Test units
        run: npm run test:unit
      - name: Build production bundle
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
