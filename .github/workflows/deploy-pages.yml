name: Deploy web app to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'about/**'
      - 'ar/**'
      - 'de/**'
      - 'fr/**'
      - 'he/**'
      - 'index.html'
      - 'original/po/ar.po'
      - 'original/po/de.po'
      - 'original/po/fr.po'
      - 'original/po/he.po'
      - 'original/Pinta.Resources/icons/hicolor/scalable/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/generate-i18n-catalogs.mjs'
      - 'scripts/generate-seo-locales.mjs'
      - 'src/**'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'web-assets/about/**'
      - 'web-assets/seo/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Verify localized catalogs
        run: npm run verify:i18n
      - name: Verify localized SEO pages
        run: npm run verify:seo
      - name: Verify effect processors
        run: npm run verify:effects
      - name: Build production bundle
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
