name: Calculate build version

on:
  workflow_call:
    outputs:
      version:
        description: Version embedded in the tested production artifact
        value: ${{ jobs.calculate.outputs.version }}

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate immutable build version
        id: version
        shell: bash
        run: |
          DATE=$(date -u +'%y%m%d')
          VERSION="1.0.${DATE}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pinta Online build version: $VERSION"
