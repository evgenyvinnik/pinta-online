name: Browser breadth

# Firefox, WebKit, and the touch device, on every push, but deliberately not in the workflow the
# Pages deploy is chained to.
#
# The reasoning is about what each check is for. Chromium behaviour, the approved screenshots, the
# unit tests and the verifiers all say whether the artifact is correct, and they gate shipping it.
# This says whether the same artifact also behaves on a second engine and a phone-sized touch
# screen, which is worth knowing on every commit and worth fixing when it breaks — but a build that
# passed everything deterministic should not be unshippable because a shared runner produced a
# Firefox-only condition that reproduces nowhere else.
#
# That is not hypothetical. On 30 August 2026 one run failed with eighteen instances of
# "InvalidStateError: An attempt was made to use an object that is not, or is no longer, usable".
# The signal was not suppressed: it led to the unhandled pagehide-save fix recorded in
# docs/final_polish.md. This workflow remains separate because cross-engine breadth and release
# artifact correctness answer different questions, not because known failures are being ignored.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  breadth:
    name: Touch
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      # Firefox will not launch from a $HOME the current user does not own, which is what the
      # runner mounts into this container.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Test touch behaviour
        run: npm run test:e2e:touch
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-breadth-report
          path: |
            playwright-report-e2e
            test-results
          if-no-files-found: ignore

  firefox:
    name: Firefox ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Test Firefox behaviour
        run: npm run test:e2e:firefox -- --shard=${{ matrix.shard }}/4
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-breadth-firefox-${{ matrix.shard }}
          path: |
            playwright-report-e2e
            test-results
          if-no-files-found: ignore

  webkit:
    name: WebKit ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Test WebKit behaviour
        # A fresh engine for each shard keeps canvas/history resources from accumulating across
        # the complete suite while still exercising the unmodified production build.
        run: npm run test:e2e:webkit -- --shard=${{ matrix.shard }}/4
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-breadth-webkit-${{ matrix.shard }}
          path: |
            playwright-report-e2e
            test-results
          if-no-files-found: ignore
