name: Web visual regression

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/update-translation-template.yml'
      - '.github/workflows/versioning.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/update-translation-template.yml'
      - '.github/workflows/versioning.yml'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:eslint
      - name: Verify localized catalogs
        run: npm run verify:i18n
      - name: Verify localized SEO pages
        run: npm run verify:seo
      - name: Verify icon references
        run: npm run verify:icons
      - name: Test units
        run: npm run test:unit
      - name: Compare approved screenshots
        run: npm run test:visual:container
      - name: Test browser behavior
        run: npm run test:e2e:container
      - name: Enforce React pointer-performance budget
        run: npm run test:performance:container
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: |
            playwright-report
            playwright-report-performance
            test-results
          if-no-files-found: ignore
