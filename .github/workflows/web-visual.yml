name: Web visual regression

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/update-translation-template.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/update-translation-template.yml'
  workflow_dispatch:

jobs:
  version:
    uses: ./.github/workflows/versioning.yml

  spelling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check spelling
        uses: codespell-project/actions-codespell@v2
        with:
          config: .codespellrc

  screenshots:
    needs: [version, spelling]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PINTA_BUILD_VERSION: ${{ needs.version.outputs.version }}
      # The container runs as root but the runner mounts a $HOME it does not own, and Firefox
      # refuses to launch from a home directory belonging to someone else. Every Firefox test
      # failed in about two milliseconds -- a launch failure, not a test failure -- which took
      # the whole workflow down with it and, because the Pages deploy is chained to this
      # workflow succeeding, silently skipped every deployment. Playwright names this exact
      # workaround in the launch error.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Verify immutable release pipeline
        run: npm run verify:release
      - name: Embed immutable build version
        run: node scripts/set-version.mjs "$PINTA_BUILD_VERSION"
      - name: Verify synchronized version metadata
        run: npm run verify:version
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Lint
        run: npm run lint:eslint
      - name: Check formatting
        run: npm run format:check
      - name: Verify localized catalogs
        run: npm run verify:i18n
      - name: Verify localized SEO pages
        run: npm run verify:seo
      - name: Verify icon references
        run: npm run verify:icons
      - name: Test units
        run: npm run test:unit
      - name: Compare approved screenshots
        run: npm run test:visual:container
      - name: Test browser behavior
        run: npm run test:e2e:container
      - name: Enforce React pointer-performance budget
        run: npm run test:performance:container
      - name: Build tested production artifact
        run: npm run build
      - name: Upload tested production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: |
            playwright-report
            playwright-report-e2e
            playwright-report-performance
            test-results
          if-no-files-found: ignore
