name: Web visual regression

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/web-visual.yml'
      - 'original/Pinta.Resources/icons/**'
      - 'about/**'
      - 'ar/**'
      - 'de/**'
      - 'fr/**'
      - 'he/**'
      - 'index.html'
      - 'original/po/ar.po'
      - 'original/po/de.po'
      - 'original/po/fr.po'
      - 'original/po/he.po'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'scripts/build-visual-review.mjs'
      - 'scripts/generate-i18n-catalogs.mjs'
      - 'scripts/generate-seo-locales.mjs'
      - 'scripts/run-visual-tests.mjs'
      - 'src/**'
      - 'tests/visual/**'
      - 'vite.config.ts'
  pull_request:
    paths:
      - '.github/workflows/web-visual.yml'
      - 'original/Pinta.Resources/icons/**'
      - 'about/**'
      - 'ar/**'
      - 'de/**'
      - 'fr/**'
      - 'he/**'
      - 'index.html'
      - 'original/po/ar.po'
      - 'original/po/de.po'
      - 'original/po/fr.po'
      - 'original/po/he.po'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'scripts/build-visual-review.mjs'
      - 'scripts/generate-i18n-catalogs.mjs'
      - 'scripts/generate-seo-locales.mjs'
      - 'scripts/run-visual-tests.mjs'
      - 'src/**'
      - 'tests/visual/**'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Verify localized catalogs
        run: npm run verify:i18n
      - name: Verify localized SEO pages
        run: npm run verify:seo
      - name: Verify effect processors
        run: npm run verify:effects
      - name: Verify icon references
        run: npm run verify:icons
      - name: Compare approved screenshots
        run: npm run test:visual:container
      - name: Test browser behavior
        run: npm run test:e2e:container
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
